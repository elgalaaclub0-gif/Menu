<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | منيو نادي الجلاء</title>
  
  <script>
    var pass = prompt("من فضلك أدخل كلمة مرور لوحة التحكم:");
    if (pass !== "123456") {
      alert("كلمة المرور غير صحيحة!");
      window.location.href = "index.html";
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #A31219;
      --gold: #DDAA38;
      --bg: #121214;
      --card: #1B1B1F;
      --border: #2C2C32;
      --blue: #2980B9;
      --green: #27ae60;
      --dark-btn: #33333d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: var(--bg); color: #fff; padding: 20px 15px; }

    .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .header h1 { color: var(--gold); font-size: 22px; }
    
    .menu-type-tabs {
      display: flex;
      max-width: 780px;
      margin: 0 auto 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      gap: 8px;
    }
    .menu-tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: #A0A0A8;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
    }
    .menu-tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(163, 18, 25, 0.4);
    }

    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; max-width: 780px; margin-inline: auto; }
    .panel h2 { font-size: 16px; color: var(--gold); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: #A0A0A8; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { 
      width: 100%; 
      padding: 10px; 
      background: #24242A; 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      color: #fff; 
      font-size: 14px; 
      outline: none; 
    }
    .form-group textarea { resize: vertical; min-height: 60px; font-family: inherit; }
    
    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }
    
    .btn { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; font-size: 14px; }
    .btn:hover { background: #BF161E; }
    
    .cat-accordion-group {
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
      background: #1e1e24;
    }
    .cat-accordion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: #25252c;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .cat-accordion-header:hover { background: #2c2c36; }
    .cat-title-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .cat-title-info i.arrow-icon { font-size: 12px; color: var(--gold); transition: transform 0.3s ease; }
    .cat-title-info.active i.arrow-icon { transform: rotate(180deg); }
    .cat-badge {
      font-size: 11px;
      background: rgba(221, 170, 56, 0.2);
      color: var(--gold);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .cat-icon-display { font-size: 18px; margin-inline-end: 4px; }
    .cat-header-actions { display: flex; align-items: center; gap: 6px; }
    .cat-body-items {
      display: none;
      padding: 10px;
      background: #18181c;
      border-top: 1px solid var(--border);
    }
    
    .item-row { display: flex; justify-content: space-between; align-items: center; background: #222228; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #2a2a32; }
    .actions-box { display: flex; align-items: center; gap: 5px; }
    .del-btn { background: #E74C3C; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .del-btn:hover { background: #c0392b; }
    .edit-btn { background: var(--blue); color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .edit-btn:hover { background: #1f618d; }
    .order-btn { background: var(--dark-btn); color: var(--gold); border: 1px solid var(--border); padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .order-btn:hover { background: #444450; color: #fff; }
    .item-thumb { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; margin-inline-end: 10px; vertical-align: middle; }

    #edit-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      padding: 15px;
    }
    .modal-content {
      background: var(--card);
      border: 1px solid var(--blue);
      border-radius: 12px;
      padding: 20px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .modal-header h3 { color: var(--gold); font-size: 16px; }
    .close-modal { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <h1>لوحة إدارة منيو نادي الجلاء</h1>
    <p style="font-size: 12px; color: #A0A0A8; margin-top: 4px;">إدارة قوائم صالة المطعم، منفذ التيك أواي، ومنفذ الحلواني</p>
  </div>

  <div class="menu-type-tabs">
    <button class="menu-tab-btn active" id="tab-restaurant" onclick="switchMenuMode('restaurant')">
      <i class="fa-solid fa-utensils"></i> صالة المطعم
    </button>
    <button class="menu-tab-btn" id="tab-takeaway" onclick="switchMenuMode('takeaway')">
      <i class="fa-solid fa-bag-shopping"></i> منفذ التيك أواي
    </button>
    <button class="menu-tab-btn" id="tab-pastry" onclick="switchMenuMode('pastry')">
      <i class="fa-solid fa-cake-candles"></i> منفذ الحلواني
    </button>
  </div>

  <!-- إضافة قسم جديد -->
  <div class="panel">
    <h2><i class="fa-solid fa-folder-plus"></i> إضافة قسم جديد إلى (<span id="txt-current-section-cat">صالة المطعم</span>)</h2>
    <div class="row">
      <div class="form-group" style="flex: 2;">
        <label>اسم القسم بالعربي (مترجم تلقائياً)</label>
        <input type="text" id="cat-name-ar" placeholder="مثال: مشويات">
      </div>
      <div class="form-group" style="flex: 2;">
        <label>اسم القسم بالإنجليزي</label>
        <input type="text" id="cat-name-en" placeholder="e.g. Grills">
      </div>
      <div class="form-group" style="flex: 1;">
        <label>الإيموجي</label>
        <input type="text" id="cat-icon" placeholder="🍗" value="🍽️">
      </div>
    </div>
    <button class="btn" onclick="addCategory()"><i class="fa-solid fa-plus"></i> إضافة القسم</button>
  </div>

  <!-- إضافة صنف جديد -->
  <div class="panel">
    <h2><i class="fa-solid fa-plus-circle"></i> إضافة صنف جديد إلى (<span id="txt-current-section-item">صالة المطعم</span>)</h2>
    
    <div class="form-group">
      <label>اختر القسم</label>
      <select id="item-cat"></select>
    </div>

    <div class="row">
      <div class="form-group">
        <label>اسم الصنف (بالعربي)</label>
        <input type="text" id="name-ar" placeholder="مثال: كباب مشوي">
      </div>
      <div class="form-group">
        <label>Item Name (English)</label>
        <input type="text" id="name-en" placeholder="e.g. Grilled Kebab">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>وصف الصنف (بالعربي) - اختياري</label>
        <textarea id="desc-ar" placeholder="مثال: تقدم مع أرز ابيض او بطاطس + خضار مشوي"></textarea>
      </div>
      <div class="form-group">
        <label>Description (English) - Optional</label>
        <textarea id="desc-en" placeholder="e.g. Served with white rice or potatoes + grilled vegetables"></textarea>
      </div>
    </div>

    <div class="form-group">
      <label>رابط صورة الوجبة (اختياري)</label>
      <input type="text" id="item-img" placeholder="https://example.com/photo.jpg">
    </div>

    <div class="row">
      <div class="form-group">
        <label>سعر العضوية (ج.م)</label>
        <input type="number" id="member-price" placeholder="40">
      </div>
      <div class="form-group">
        <label>سعر الزائر (ج.م)</label>
        <input type="number" id="guest-price" placeholder="50">
      </div>
    </div>

    <button class="btn" id="save-btn" onclick="addItem()"><i class="fa-solid fa-check"></i> حفظ الصنف في المنيو</button>
  </div>

  <!-- عرض الأصناف مقسمة حسب الفئات -->
  <div class="panel">
    <h2><i class="fa-solid fa-layer-group"></i> الأصناف الحالية (<span id="txt-current-section-list">صالة المطعم</span>)</h2>
    <div id="accordion-container">جاري تحميل البيانات...</div>
  </div>

  <!-- نافذة تعديل الصنف ونقله -->
  <div id="edit-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fa-solid fa-pen-to-square"></i> تعديل بيانات الصنف ونقله</h3>
        <button class="close-modal" onclick="closeEditModal()">&times;</button>
      </div>
      <input type="hidden" id="edit-cat-idx">
      <input type="hidden" id="edit-item-idx">

      <div class="form-group">
        <label style="color:var(--gold); font-weight:bold;">القسم التابع له:</label>
        <select id="edit-item-cat"></select>
      </div>

      <div class="row">
        <div class="form-group">
          <label>اسم الصنف (بالعربي)</label>
          <input type="text" id="edit-name-ar">
        </div>
        <div class="form-group">
          <label>Item Name (English)</label>
          <input type="text" id="edit-name-en">
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>وصف الصنف (بالعربي)</label>
          <textarea id="edit-desc-ar"></textarea>
        </div>
        <div class="form-group">
          <label>Description (English)</label>
          <textarea id="edit-desc-en"></textarea>
        </div>
      </div>

      <div class="form-group">
        <label>رابط الصورة (اختياري)</label>
        <input type="text" id="edit-img">
      </div>

      <div class="row">
        <div class="form-group">
          <label>سعر العضوية (ج.م)</label>
          <input type="number" id="edit-member-price">
        </div>
        <div class="form-group">
          <label>سعر الزائر (ج.م)</label>
          <input type="number" id="edit-guest-price">
        </div>
      </div>

      <button class="btn" style="background:var(--blue);" onclick="saveEditItem()"><i class="fa-solid fa-floppy-disk"></i> حفظ التعديلات والنقل</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyALAk-3SXOw7kmrwKrGp5cp9o77Nxf9Ufo",
      authDomain: "galaa-menu.firebaseapp.com",
      projectId: "galaa-menu",
      storageBucket: "galaa-menu.firebasestorage.app",
      messagingSenderId: "853813647144",
      appId: "1:853813647144:web:f7bf868ce7af3bd4dda21d",
      measurementId: "G-BH18Y6JBGW"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let currentMode = 'restaurant';
    let currentMenuData = [];
    let openedCategories = {};
    let unsubscribeSnapshot = null;

    function formatIconDisplay(icon) {
      if (!icon) return '🍽️';
      if (typeof icon === 'string' && icon.startsWith('fa-')) {
        return `<i class="fa-solid ${icon}"></i>`;
      }
      return icon;
    }

    async function autoTranslate(text) {
      if (!text || !text.trim()) return '';
      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.trim())}&langpair=ar|en`);
        const data = await res.json();
        if (data && data.responseData && data.responseData.translatedText) {
          return data.responseData.translatedText;
        }
      } catch (err) {}
      return '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const bindTrans = (arId, enId, def) => {
        const ar = document.getElementById(arId);
        const en = document.getElementById(enId);
        if (ar && en) {
          ar.addEventListener('blur', async () => {
            if (ar.value.trim() && !en.value.trim()) {
              en.placeholder = "جاري الترجمة...";
              const res = await autoTranslate(ar.value);
              if (res) en.value = res;
              en.placeholder = def;
            }
          });
        }
      };

      bindTrans('cat-name-ar', 'cat-name-en', 'e.g. Grills');
      bindTrans('name-ar', 'name-en', 'e.g. Grilled Kebab');
      bindTrans('desc-ar', 'desc-en', 'e.g. Served with...');
      bindTrans('edit-name-ar', 'edit-name-en', '');
      bindTrans('edit-desc-ar', 'edit-desc-en', '');
    });

    function switchMenuMode(mode) {
      currentMode = mode;
      document.getElementById('tab-restaurant').classList.toggle('active', mode === 'restaurant');
      document.getElementById('tab-takeaway').classList.toggle('active', mode === 'takeaway');
      document.getElementById('tab-pastry').classList.toggle('active', mode === 'pastry');
      
      let label = 'صالة المطعم';
      if (mode === 'takeaway') label = 'منفذ التيك أواي';
      if (mode === 'pastry') label = 'منفذ الحلواني';

      document.getElementById('txt-current-section-cat').innerText = label;
      document.getElementById('txt-current-section-item').innerText = label;
      document.getElementById('txt-current-section-list').innerText = label;

      listenToMenuData();
    }

    function getDocName() {
      if (currentMode === 'takeaway') return 'takeaway_categories';
      if (currentMode === 'pastry') return 'pastry_categories';
      return 'categories';
    }

    function listenToMenuData() {
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      const docName = getDocName();

      unsubscribeSnapshot = db.collection("menu").doc(docName).onSnapshot((doc) => {
        if (doc.exists && doc.data() && Array.isArray(doc.data().list)) {
          currentMenuData = doc.data().list;
        } else {
          currentMenuData = [];
        }
        populateCategoriesDropdown();
        renderMenuAccordion();
      }, (error) => {
        console.error("Firebase Error: ", error);
        document.getElementById('accordion-container').innerHTML = 
          '<p style="color:#E74C3C; font-size:13px; text-align:center;">تعذر جلب البيانات من السيرفر.</p>';
      });
    }

    listenToMenuData();

    function populateCategoriesDropdown() {
      const select = document.getElementById('item-cat');
      if (!select) return;
      select.innerHTML = '';
      if (currentMenuData.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.innerText = 'يرجى إضافة قسم أولاً';
        select.appendChild(opt);
        return;
      }
      currentMenuData.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.innerHTML = `${formatIconDisplay(cat.icon)} ${cat.name_ar} (${cat.name_en || ''})`;
        select.appendChild(opt);
      });
    }

    function renderMenuAccordion() {
      const container = document.getElementById('accordion-container');
      if (!container) return;
      container.innerHTML = '';

      if (currentMenuData.length === 0) {
        let label = currentMode === 'restaurant' ? 'صالة المطعم' : (currentMode === 'takeaway' ? 'التيك أواي' : 'الحلواني');
        container.innerHTML = `<p style="color:#aaa; font-size:13px; text-align:center; padding: 15px;">لا توجد أقسام في (${label}) حالياً. يمكنك استخدام زر استرجاع القوائم بالأعلى أو إضافة قسم يدوياً.</p>`;
        return;
      }

      currentMenuData.forEach((cat, catIdx) => {
        const items = cat.items || [];
        const isOpened = openedCategories[cat.id] === true;
        const iconHtml = formatIconDisplay(cat.icon);

        const group = document.createElement('div');
        group.className = 'cat-accordion-group';

        const header = document.createElement('div');
        header.className = 'cat-accordion-header';
        header.onclick = (e) => {
          if (e.target.closest('.cat-btn-action')) return;
          toggleCategoryAccordion(cat.id);
        };

        header.innerHTML = `
          <div class="cat-title-info ${isOpened ? 'active' : ''}" id="title-info-${cat.id}">
            <i class="fa-solid fa-chevron-down arrow-icon"></i>
            <span class="cat-icon-display">${iconHtml}</span>
            <span>${cat.name_ar} <small style="color:#aaa; font-weight:normal;">(${cat.name_en || ''})</small></span>
            <span class="cat-badge">${items.length} صنف</span>
          </div>
          <div class="cat-header-actions cat-btn-action">
            <button class="order-btn" onclick="moveCategory(${catIdx}, -1)" title="تحريك لأعلى"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="order-btn" onclick="moveCategory(${catIdx}, 1)" title="تحريك لأسفل"><i class="fa-solid fa-arrow-down"></i></button>
            <button class="del-btn" onclick="deleteCategory(${catIdx})" title="حذف هذا القسم"><i class="fa-solid fa-trash"></i> حذف</button>
          </div>
        `;

        const body = document.createElement('div');
        body.className = 'cat-body-items';
        body.id = `cat-body-${cat.id}`;
        body.style.display = isOpened ? 'block' : 'none';

        if (items.length === 0) {
          body.innerHTML = '<p style="color:#888; font-size:12px; text-align:center; padding:8px;">لا توجد أصناف في هذا القسم بعد.</p>';
        } else {
          items.forEach((item, itemIdx) => {
            const row = document.createElement('div');
            row.className = 'item-row';
            const thumb = (item.img && item.img.trim() !== '') ? `<img src="${item.img}" class="item-thumb" onerror="this.style.display='none'">` : '';
            
            row.innerHTML = `
              <div>
                ${thumb}
                <strong>${item.name_ar}</strong> - <span style="color:#aaa;">${item.name_en || ''}</span><br>
                <span style="font-size: 11px; color: #888;">${item.desc_ar || 'بدون وصف'}</span><br>
                <span style="font-size: 11px; color: var(--gold);">عضو: ${item.member_price} ج.م | زائر: ${item.guest_price} ج.م</span>
              </div>
              <div class="actions-box">
                <button class="order-btn" onclick="moveItem(${catIdx}, ${itemIdx}, -1)" title="تحريك لأعلى"><i class="fa-solid fa-arrow-up"></i></button>
                <button class="order-btn" onclick="moveItem(${catIdx}, ${itemIdx}, 1)" title="تحريك لأسفل"><i class="fa-solid fa-arrow-down"></i></button>
                <button class="edit-btn" onclick="openEditModal(${catIdx}, ${itemIdx})"><i class="fa-solid fa-pen"></i> تعديل / نقل</button>
                <button class="del-btn" onclick="deleteItem(${catIdx}, ${itemIdx})"><i class="fa-solid fa-trash"></i> حذف</button>
              </div>
            `;
            body.appendChild(row);
          });
        }

        group.appendChild(header);
        group.appendChild(body);
        container.appendChild(group);
      });
    }

    function toggleCategoryAccordion(catId) {
      openedCategories[catId] = !openedCategories[catId];
      const body = document.getElementById(`cat-body-${catId}`);
      const titleInfo = document.getElementById(`title-info-${catId}`);
      if (body) {
        const isOpen = openedCategories[catId];
        body.style.display = isOpen ? 'block' : 'none';
        if (titleInfo) titleInfo.classList.toggle('active', isOpen);
      }
    }

    function moveCategory(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= currentMenuData.length) return;
      const temp = currentMenuData[index];
      currentMenuData[index] = currentMenuData[newIndex];
      currentMenuData[newIndex] = temp;
      saveToFirebase();
    }

    function moveItem(catIdx, itemIdx, direction) {
      const items = currentMenuData[catIdx].items;
      const newIndex = itemIdx + direction;
      if (newIndex < 0 || newIndex >= items.length) return;
      const temp = items[itemIdx];
      items[itemIdx] = items[newIndex];
      items[newIndex] = temp;
      saveToFirebase();
    }

    function addCategory() {
      const nameAr = document.getElementById('cat-name-ar').value.trim();
      const nameEn = document.getElementById('cat-name-en').value.trim();
      let icon = document.getElementById('cat-icon').value.trim() || '🍽️';

      if (!nameAr) {
        alert("يرجى إدخال اسم القسم بالعربي");
        return;
      }
      const newCatId = "cat_" + Date.now();
      currentMenuData.push({
        id: newCatId,
        name_ar: nameAr,
        name_en: nameEn || nameAr,
        icon: icon,
        items: []
      });
      openedCategories[newCatId] = true;
      
      saveToFirebase(() => {
        document.getElementById('cat-name-ar').value = '';
        document.getElementById('cat-name-en').value = '';

    function deleteCategory(catIdx) {
      const catName = currentMenuData[catIdx].name_ar;
      if (confirm(`هل أنت متأكد من حذف قسم "${catName}" وجميع الأصناف بداخله؟`)) {

        });
      }

    function addItem() {
      const catId = document.getElementById('item-cat').value;
      if (!catId) {
        alert("يرجى اختيار القسم أولاً");
        return;
      }
      const nameAr = document.getElementById('name-ar').value.trim();
      const nameEn = document.getElementById('name-en').value.trim();
      const descAr = document.getElementById('desc-ar').value.trim();
      const descEn = document.getElementById('desc-en').value.trim();
      const img = document.getElementById('item-img').value.trim();
      const mPrice = parseFloat(document.getElementById('member-price').value);
      const gPrice = parseFloat(document.getElementById('guest-price').value);

      if (!nameAr || isNaN(mPrice) || isNaN(gPrice)) {
        alert("يرجى ملء الاسم والأسعار المطلوبة");
        return;
      }

      const targetCat = currentMenuData.find(c => c.id === catId);
      if (targetCat) {
        if (!targetCat.items) targetCat.items = [];
        targetCat.items.push({
          name_ar: nameAr,
          name_en: nameEn || nameAr,
          desc_ar: descAr,
          desc_en: descEn,
          img: img,
          member_price: mPrice,
          guest_price: gPrice
        });

        openedCategories[catId] = true;

        saveToFirebase(() => {
          document.getElementById('name-ar').value = '';
          document.getElementById('name-en').value = '';
          document.getElementById('desc-ar').value = '';
          document.getElementById('desc-en').value = '';
          document.getElementById('item-img').value = '';
          document.getElementById('member-price').value = '';
          document.getElementById('guest-price').value = '';
          alert("تم حفظ الصنف بنجاح!");
        });
      }
    }

    function openEditModal(catIdx, itemIdx) {
      const item = currentMenuData[catIdx].items[itemIdx];
      document.getElementById('edit-cat-idx').value = catIdx;
      document.getElementById('edit-item-idx').value = itemIdx;

      const catSelect = document.getElementById('edit-item-cat');
      catSelect.innerHTML = '';
      currentMenuData.forEach((cat, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerHTML = `${formatIconDisplay(cat.icon)} ${cat.name_ar}`;
        if (idx === catIdx) opt.selected = true;
        catSelect.appendChild(opt);
      });

      document.getElementById('edit-name-ar').value = item.name_ar || '';
      document.getElementById('edit-name-en').value = item.name_en || '';
      document.getElementById('edit-desc-ar').value = item.desc_ar || '';
      document.getElementById('edit-desc-en').value = item.desc_en || '';
      document.getElementById('edit-img').value = item.img || '';
      document.getElementById('edit-member-price').value = item.member_price;
      document.getElementById('edit-guest-price').value = item.guest_price;
      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    function saveEditItem() {
      const oldCatIdx = parseInt(document.getElementById('edit-cat-idx').value);
      const itemIdx = parseInt(document.getElementById('edit-item-idx').value);
      const newCatIdx = parseInt(document.getElementById('edit-item-cat').value);

      const nameAr = document.getElementById('edit-name-ar').value.trim();
      const nameEn = document.getElementById('edit-name-en').value.trim();
      const descAr = document.getElementById('desc-ar').value.trim();
      const descEn = document.getElementById('desc-en').value.trim();
      const img = document.getElementById('edit-img').value.trim();
      const mPrice = parseFloat(document.getElementById('edit-member-price').value);
      const gPrice = parseFloat(document.getElementById('edit-guest-price').value);

      if (!nameAr || isNaN(mPrice) || isNaN(gPrice)) {
        alert("يرجى ملء الاسم والأسعار المطلوبة بشكل صحيح");
        return;
      }

      const updatedItem = {
        name_ar: nameAr,
        name_en: nameEn || nameAr,
        desc_ar: descAr,
        desc_en: descEn,
        img: img,
        member_price: mPrice,
        guest_price: gPrice
      };

      if (oldCatIdx !== newCatIdx) {
        currentMenuData[oldCatIdx].items.splice(itemIdx, 1);
        if (!currentMenuData[newCatIdx].items) currentMenuData[newCatIdx].items = [];
        currentMenuData[newCatIdx].items.push(updatedItem);
        openedCategories[currentMenuData[newCatIdx].id] = true;
      } else {
        currentMenuData[oldCatIdx].items[itemIdx] = updatedItem;
      }

      saveToFirebase(() => {
        closeEditModal();
        alert("تم تحديث وحفظ الصنف بنجاح!");
      });
    }

    function deleteItem(catIdx, itemIdx) {
      if (confirm("هل تريد حذف هذا الصنف؟")) {
        currentMenuData[catIdx].items.splice(itemIdx, 1);
        saveToFirebase();
      }
    }

    function saveToFirebase(callback) {
      const docName = getDocName();
      db.collection("menu").doc(docName).set({ list: currentMenuData }).then(() => {
        if (callback) callback();
      }).catch(err => {
        alert("خطأ أثناء الحفظ: " + err.message);
      });
    }
