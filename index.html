<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>قائمة طعام | نادي الجلاء للقوات المسلحة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-red: #A31219;
      --dark-red: #66080D;
      --accent-gold: #DDAA38;
      --gold-light: #F7E7A6;
      --bg-dark: #121214;
      --card-bg: #1B1B1F;
      --card-border: #2C2C32;
      --text-main: #FFFFFF;
      --text-muted: #A0A0A8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body.en {
      font-family: 'Outfit', sans-serif;
      direction: ltr;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(180deg, var(--dark-red) 0%, rgba(18, 18, 20, 0.95) 100%);
      padding: 20px 16px 16px;
      text-align: center;
      border-bottom: 1px solid rgba(221, 170, 56, 0.25);
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      position: relative;
    }

    /* القائمة المنسدلة لاختيار المنفذ */
    .dropdown-container {
      position: relative;
      display: inline-block;
    }

    .service-dropdown-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--accent-gold);
      color: var(--gold-light);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .service-dropdown-btn:hover {
      background: var(--accent-gold);
      color: #121214;
    }
    .service-dropdown-btn i.fa-chevron-down {
      font-size: 11px;
      transition: transform 0.25s;
    }
    .service-dropdown-btn.open i.fa-chevron-down {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      background: #1e1e24;
      border: 1px solid var(--accent-gold);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      min-width: 190px;
      z-index: 1000;
      overflow: hidden;
    }
    body:not(.en) .dropdown-menu { right: 0; }
    body.en .dropdown-menu { left: 0; }

    .dropdown-menu.show {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      background: transparent;
      border: none;
      width: 100%;
      text-align: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    .dropdown-item:hover {
      background: rgba(221, 170, 56, 0.15);
      color: var(--gold-light);
    }
    .dropdown-item.active {
      background: var(--primary-red);
      color: #fff;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .logo-container {
      width: 85px;
      height: 85px;
      margin: 0 auto 10px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-gold), transparent, var(--accent-gold));
      box-shadow: 0 4px 20px rgba(163, 18, 25, 0.4);
      overflow: hidden;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .club-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--gold-light);
      margin-bottom: 4px;
    }

    .sub-title {
      font-size: 13px;
      color: var(--text-muted);
    }

    .pricing-toggle-wrapper {
      margin: 16px auto 6px;
      max-width: 320px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 4px;
      display: flex;
    }

    .toggle-btn {
      flex: 1;
      text-align: center;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 25px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .toggle-btn.active {
      background: var(--primary-red);
      color: #fff;
    }

    .toggle-btn.member.active {
      background: linear-gradient(135deg, #B8860B, var(--accent-gold));
      color: #121214;
    }

    .search-box-container {
      padding: 12px 16px 4px;
    }

    .search-bar {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
    }

    .search-bar input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 11px 40px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-bar i {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    body:not(.en) .search-bar i { right: 14px; }
    body.en .search-bar i { left: 14px; }

    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      background: rgba(18, 18, 20, 0.95);
      backdrop-filter: blur(8px);
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .category-chip {
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .category-chip.active {
      background: var(--primary-red);
      color: #fff;
      border-color: var(--accent-gold);
    }

    .menu-container {
      padding: 16px;
      max-width: 700px;
      margin: 0 auto;
    }

    .category-section {
      margin-bottom: 26px;
      scroll-margin-top: 70px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--accent-gold);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px dashed rgba(221, 170, 56, 0.3);
      padding-bottom: 6px;
    }

    .items-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      transition: transform 0.2s, border-color 0.2s;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: rgba(221, 170, 56, 0.4);
    }

    .item-img {
      width: 65px;
      height: 65px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    .item-details { flex: 1; }

    .item-name {
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 3px;
    }

    .item-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .member-badge {
      display: inline-block;
      font-size: 10px;
      background: rgba(221, 170, 56, 0.15);
      color: var(--accent-gold);
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 4px;
    }

    .price-container {
      text-align: end;
      min-width: 75px;
    }

    .price-value {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .currency { font-size: 11px; }

    .price-type-label {
      display: block;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    footer {
      text-align: center;
      padding: 24px 16px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <header>
    <div class="top-controls">
      <!-- القائمة المنسدلة لاختيار المنفذ -->
      <div class="dropdown-container">
        <button class="service-dropdown-btn" id="service-dropdown-btn" onclick="toggleDropdown(event)">
          <i class="fa-solid fa-utensils" id="service-icon"></i>
          <span id="service-text">صالة المطعم</span>
          <i class="fa-solid fa-chevron-down"></i>
        </button>

        <div class="dropdown-menu" id="service-dropdown-menu">
          <button class="dropdown-item" id="opt-restaurant" onclick="selectServiceMode('restaurant')">
            <i class="fa-solid fa-utensils"></i>
            <span id="txt-opt-restaurant">صالة المطعم</span>
          </button>
          <button class="dropdown-item" id="opt-takeaway" onclick="selectServiceMode('takeaway')">
            <i class="fa-solid fa-bag-shopping"></i>
            <span id="txt-opt-takeaway">منفذ التيك أواي</span>
          </button>
          <button class="dropdown-item" id="opt-pastry" onclick="selectServiceMode('pastry')">
            <i class="fa-solid fa-cake-candles"></i>
            <span id="txt-opt-pastry">منفذ الحلواني</span>
          </button>
        </div>
      </div>

      <button class="lang-btn" onclick="toggleLanguage()">
        <i class="fa-solid fa-globe"></i>
        <span id="lang-label">English</span>
      </button>
    </div>

    <div class="logo-container">
      <img src="435341.jpg" alt="Logo" onerror="this.src='https://via.placeholder.com/90/A31219/FFFFFF?text=Galaa'">
    </div>

    <h1 class="club-title" id="txt-title">نادي الجلاء للقوات المسلحة</h1>
    <p class="sub-title" id="txt-sub">قائمة الأطعمة والمشروبات | صالة المطعم</p>

    <div class="pricing-toggle-wrapper">
      <button class="toggle-btn member active" id="btn-member" onclick="setPriceMode('member')">
        <i class="fa-solid fa-id-card"></i>
        <span id="txt-member-btn">حاملي العضوية</span>
      </button>
      <button class="toggle-btn" id="btn-guest" onclick="setPriceMode('guest')">
        <i class="fa-solid fa-user"></i>
        <span id="txt-guest-btn">الزائرين</span>
      </button>
    </div>
  </header>

  <div class="search-box-container">
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="ابحث عن صنف أو طبق..." oninput="handleSearch()">
    </div>
  </div>

  <div class="categories-bar" id="categories-bar"></div>
  <main class="menu-container" id="menu-container"></main>

  <footer>
    <p id="txt-footer">نادي الجلاء للقوات المسلحة &copy; 2026</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyALAk-3SXOw7kmrwKrGp5cp9o77Nxf9Ufo",
      authDomain: "galaa-menu.firebaseapp.com",
      projectId: "galaa-menu",
      storageBucket: "galaa-menu.firebasestorage.app",
      messagingSenderId: "853813647144",
      appId: "1:853813647144:web:f7bf868ce7af3bd4dda21d",
      measurementId: "G-BH18Y6JBGW"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // فحص الرابط: restaurant, takeaway, أو pastry
    const urlParams = new URLSearchParams(window.location.search);
    let rawType = urlParams.get('type');
    let serviceType = (rawType === 'takeaway' || rawType === 'pastry') ? rawType : 'restaurant';

    let menuData = [];
    let currentLang = 'ar';
    let currentPricingMode = 'member';
    let currentFilter = '';
    let unsubscribeFirestore = null;

    const translations = {
      ar: {
        langBtn: "English",
        title: "نادي وفنادق القوات المسلحة",
        subRestaurant: "قائمة الأطعمة والمشروبات | صالة المطعم",
        subTakeaway: "قائمة الوجبات السريعة | منفذ التيك أواي",
        subPastry: "قائمة الحلويات والمخبوزات | منفذ الحلواني",
        optRestaurant: "صالة المطعم",
        optTakeaway: "منفذ التيك أواي",
        optPastry: "منفذ الحلواني",
        memberBtn: "حاملي العضوية",
        guestBtn: "الزائرين",
        searchPlaceholder: "ابحث عن صنف أو طبق...",
        currency: "ج.م",
        memberPriceLabel: "سعر العضوية",
        guestPriceLabel: "سعر الزائر",
        footer: "نادي الجلاء للقوات المسلحة © 2026",
        emptyMsg: "لا توجد أصناف معروضة في هذا المنفذ حالياً."
      },
      en: {
        langBtn: "العربية",
        title: "Armed Forces Clubs & Hotels",
        subRestaurant: "Food & Beverage Menu | Dine-in Restaurant",
        subTakeaway: "Fast Food Menu | Takeaway Outlet",
        subPastry: "Pastries & Sweets Menu | Pastry Outlet",
        optRestaurant: "Dine-in Restaurant",
        optTakeaway: "Takeaway Outlet",
        optPastry: "Pastry & Bakery",
        memberBtn: "Club Members",
        guestBtn: "Visitors / Guests",
        searchPlaceholder: "Search for dishes...",
        currency: "EGP",
        memberPriceLabel: "Member Price",
        guestPriceLabel: "Visitor Price",
        footer: "Al-Galaa Armed Forces Club © 2026",
        emptyMsg: "No items available in this outlet currently."
      }
    };

    function formatIcon(icon) {
      if (!icon) return '🍽️';
      if (typeof icon === 'string' && icon.startsWith('fa-')) {
        return `<i class="fa-solid ${icon}"></i>`;
      }
      return icon;
    }

    function toggleDropdown(e) {
      e.stopPropagation();
      const menu = document.getElementById('service-dropdown-menu');
      const btn = document.getElementById('service-dropdown-btn');
      const isOpen = menu.classList.contains('show');
      if (isOpen) {
        menu.classList.remove('show');
        btn.classList.remove('open');
      } else {
        menu.classList.add('show');
        btn.classList.add('open');
      }
    }

    document.addEventListener('click', (e) => {
      const dropdown = document.querySelector('.dropdown-container');
      if (dropdown && !dropdown.contains(e.target)) {
        document.getElementById('service-dropdown-menu').classList.remove('show');
        document.getElementById('service-dropdown-btn').classList.remove('open');
      }
    });

    function selectServiceMode(mode) {
      serviceType = mode;
      document.getElementById('service-dropdown-menu').classList.remove('show');
      document.getElementById('service-dropdown-btn').classList.remove('open');

      const newUrl = window.location.pathname + '?type=' + serviceType;
      window.history.replaceState(null, '', newUrl);

      updateServiceUI();
      listenToMenuData();
    }

    function updateServiceUI() {
      const t = translations[currentLang];
      const iconElem = document.getElementById('service-icon');
      const textElem = document.getElementById('service-text');
      const subElem = document.getElementById('txt-sub');

      document.getElementById('opt-restaurant').classList.toggle('active', serviceType === 'restaurant');
      document.getElementById('opt-takeaway').classList.toggle('active', serviceType === 'takeaway');
      document.getElementById('opt-pastry').classList.toggle('active', serviceType === 'pastry');

      document.getElementById('txt-opt-restaurant').innerText = t.optRestaurant;
      document.getElementById('txt-opt-takeaway').innerText = t.optTakeaway;
      document.getElementById('txt-opt-pastry').innerText = t.optPastry;

      if (serviceType === 'takeaway') {
        iconElem.className = 'fa-solid fa-bag-shopping';
        textElem.innerText = t.optTakeaway;
        subElem.innerText = t.subTakeaway;
      } else if (serviceType === 'pastry') {
        iconElem.className = 'fa-solid fa-cake-candles';
        textElem.innerText = t.optPastry;
        subElem.innerText = t.subPastry;
      } else {
        iconElem.className = 'fa-solid fa-utensils';
        textElem.innerText = t.optRestaurant;
        subElem.innerText = t.subRestaurant;
      }
    }

    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.body.className = currentLang === 'en' ? 'en' : '';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'en' ? 'ltr' : 'rtl';
      
      const t = translations[currentLang];
      document.getElementById('lang-label').innerText = t.langBtn;
      document.getElementById('txt-title').innerText = t.title;
      document.getElementById('txt-member-btn').innerText = t.memberBtn;
      document.getElementById('txt-guest-btn').innerText = t.guestBtn;
      document.getElementById('search-input').placeholder = t.searchPlaceholder;
      document.getElementById('txt-footer').innerText = t.footer;

      updateServiceUI();
      renderCategories();
      renderMenu();
    }

    function setPriceMode(mode) {
      currentPricingMode = mode;
      document.getElementById('btn-member').classList.toggle('active', mode === 'member');
      document.getElementById('btn-guest').classList.toggle('active', mode === 'guest');
      renderMenu();
    }

    function renderCategories() {
      const bar = document.getElementById('categories-bar');
      bar.innerHTML = '';
      menuData.forEach((cat, index) => {
        const chip = document.createElement('button');
        chip.className = `category-chip ${index === 0 ? 'active' : ''}`;
        const iconHtml = formatIcon(cat.icon);
        chip.innerHTML = `${iconHtml} <span>${currentLang === 'ar' ? cat.name_ar : (cat.name_en || cat.name_ar)}</span>`;
        chip.onclick = () => {
          document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          const target = document.getElementById(`cat-${cat.id}`);
          if (target) target.scrollIntoView({ behavior: 'smooth' });
        };
        bar.appendChild(chip);
      });
    }

    function renderMenu() {
      const container = document.getElementById('menu-container');
      const t = translations[currentLang];
      container.innerHTML = '';

      if (menuData.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#aaa; margin-top:30px;">${t.emptyMsg}</p>`;
        return;
      }

      menuData.forEach(cat => {
        const filteredItems = (cat.items || []).filter(item => {
          const name = currentLang === 'ar' ? item.name_ar : (item.name_en || item.name_ar);
          const desc = currentLang === 'ar' ? (item.desc_ar || '') : (item.desc_en || '');
          return name.toLowerCase().includes(currentFilter.toLowerCase()) || 
                 desc.toLowerCase().includes(currentFilter.toLowerCase());
        });

        if (filteredItems.length === 0) return;

        const section = document.createElement('section');
        section.className = 'category-section';
        section.id = `cat-${cat.id}`;

        const title = document.createElement('h2');
        title.className = 'section-title';
        const iconHtml = formatIcon(cat.icon);
        title.innerHTML = `${iconHtml} <span>${currentLang === 'ar' ? cat.name_ar : (cat.name_en || cat.name_ar)}</span>`;
        section.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'items-grid';

        filteredItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'item-card';

          const price = currentPricingMode === 'member' ? item.member_price : item.guest_price;
          const priceLabel = currentPricingMode === 'member' ? t.memberPriceLabel : t.guestPriceLabel;
          
          const imageHtml = (item.img && item.img.trim() !== '') 
            ? `<img src="${item.img}" class="item-img" alt="${item.name_ar}" onerror="this.style.display='none'">` 
            : '';

          card.innerHTML = `
            ${imageHtml}
            <div class="item-details">
              <div class="item-name">${currentLang === 'ar' ? item.name_ar : (item.name_en || item.name_ar)}</div>
              ${(item.desc_ar || item.desc_en) ? `<div class="item-desc">${currentLang === 'ar' ? (item.desc_ar || '') : (item.desc_en || '')}</div>` : ''}
              ${currentPricingMode === 'member' ? `<span class="member-badge"><i class="fa-solid fa-id-badge"></i> ${currentLang === 'ar' ? 'عضوية' : 'Member'}</span>` : ''}
            </div>
            <div class="price-container">
              <div class="price-value">${price} <span class="currency">${t.currency}</span></div>
              <span class="price-type-label">${priceLabel}</span>
            </div>
          `;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    function handleSearch() {
      currentFilter = document.getElementById('search-input').value.trim();
      renderMenu();
    }

    function listenToMenuData() {
      if (unsubscribeFirestore) unsubscribeFirestore();
      
      let docName = 'categories';
      if (serviceType === 'takeaway') docName = 'takeaway_categories';
      if (serviceType === 'pastry') docName = 'pastry_categories';

      unsubscribeFirestore = db.collection("menu").doc(docName).onSnapshot((doc) => {
        if (doc.exists && doc.data() && Array.isArray(doc.data().list)) {
          menuData = doc.data().list;
        } else {
          menuData = [];
        }
        renderCategories();
        renderMenu();
      });
    }

    updateServiceUI();
    listenToMenuData();
  </script>
</body>
</html>
